name: 'Install slsactl'
description: 'Install Cosign and a custom slsactl build from a URL, verified against a SHA-256 checksum; use only for test builds'

inputs:
  url:
    description: 'URL of a .tar.gz archive containing the slsactl binary at its root'
    required: true
  sha256:
    description: 'SHA-256 checksum of the file at url'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Install Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Install slsactl
      shell: bash
      env:
        SHA256: ${{ inputs.sha256 }}
        URL: ${{ inputs.url }}
      run: |
        if [[ -z "$URL" ]]; then
          echo "The url input is required" >&2
          exit 1
        fi
        if [[ ! "$SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
          echo "The sha256 input must be a SHA-256 hex digest" >&2
          exit 1
        fi
        echo "::warning::Installing a custom slsactl build from ${URL}"

        work_dir="$(mktemp -d)"
        trap 'rm -rf "$work_dir"' EXIT
        cd "$work_dir"

        curl --fail --silent --show-error --location --retry 3 --retry-connrefused \
          --output download "$URL"
        echo "${SHA256,,}  download" | sha256sum --check
        tar -xzf download slsactl

        bin_dir="${RUNNER_TEMP}/slsactl/bin"
        install -D -m 755 slsactl "${bin_dir}/slsactl"
        echo "$bin_dir" >> "$GITHUB_PATH"
        "${bin_dir}/slsactl" version
