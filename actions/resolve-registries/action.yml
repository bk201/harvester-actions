name: 'Resolve Registries'
description: 'Decide which registries this build should publish to, based on the release tag and release state'

# Publish rules:
# 1. Not a release (branch push / nightly): push to docker-io and staging.
# 2. Release published:
#    - tag starts with "prime-":
#        - stripped tag matches exactly vX.Y.Z: push to prime only
#        - otherwise (pre-release such as vX.Y.Z-rc1 or vX.Y.Z-dev1, or not
#          version-like): push to staging only
#    - tag does not start with "prime-": push to docker-io only
# 3. registries is not "auto": push to exactly the listed registries,
#    regardless of the rules above.

inputs:
  release-tag-name:
    description: 'Tag/name identifying this build (e.g. master-head, pull-123, or the release tag)'
    required: true
  is-release:
    description: 'Whether this build is triggered by a published release ("true"/"false")'
    required: true
  registries:
    description: 'Registry selection: "auto" applies the publish rules; otherwise a comma-separated list of docker-io, staging, and prime to publish to exactly those (e.g. "docker-io,prime")'
    required: false
    default: 'auto'

outputs:
  use-docker-io:
    value: ${{ steps.rules.outputs.use-docker-io }}
    description: 'Whether to publish to the Docker Hub-compatible registry ("true"/"false")'
  use-staging:
    value: ${{ steps.rules.outputs.use-staging }}
    description: 'Whether to publish to the staging registry ("true"/"false")'
  use-prime:
    value: ${{ steps.rules.outputs.use-prime }}
    description: 'Whether to publish to the prime registry ("true"/"false")'

runs:
  using: "composite"
  steps:
    - name: Resolve publish rules
      id: rules
      shell: bash
      env:
        REGISTRIES: ${{ inputs.registries }}
      run: |
        release_tag_name="${{ inputs.release-tag-name }}"

        use_docker_io=false
        use_staging=false
        use_prime=false

        if [[ "$REGISTRIES" != "auto" ]]; then
          IFS=',' read -ra registries <<< "$REGISTRIES"
          for registry in "${registries[@]}"; do
            registry="${registry//[[:space:]]/}"
            case "$registry" in
              docker-io) use_docker_io=true ;;
              staging) use_staging=true ;;
              prime) use_prime=true ;;
              "") ;;
              *)
                echo "::error::unknown registry \"$registry\" in registries; want \"auto\" or a comma-separated list of docker-io, staging, prime"
                exit 1
                ;;
            esac
          done
          if [[ "$use_docker_io$use_staging$use_prime" == "falsefalsefalse" ]]; then
            echo "::error::registries lists no registry; want \"auto\" or a comma-separated list of docker-io, staging, prime"
            exit 1
          fi
        elif [[ "${{ inputs.is-release }}" == "true" ]]; then
          if [[ "$release_tag_name" == prime-* ]]; then
            stripped_tag="${release_tag_name#prime-}"
            if [[ "$stripped_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              use_prime=true
            else
              use_staging=true
            fi
          else
            use_docker_io=true
          fi
        else
          use_docker_io=true
          use_staging=true
        fi

        echo "use-docker-io=$use_docker_io" >> "$GITHUB_OUTPUT"
        echo "use-staging=$use_staging" >> "$GITHUB_OUTPUT"
        echo "use-prime=$use_prime" >> "$GITHUB_OUTPUT"

        echo "::notice title=Resolved registries::Docker Hub: $use_docker_io, Staging: $use_staging, Prime: $use_prime"
